<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales to Onboarding</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#dde1e6;--ac:#2457d6;--acx:#fff;--ok:#157347;--er:#b42318;--hd:#eef1f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--card:#1e2328;--tx:#e8ebee;--mu:#9aa5b1;--bd:#333b44;--ac:#6b93f5;--acx:#0d1117;--ok:#4cc38a;--er:#f08a80;--hd:#262c33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181c;--card:#1e2328;--tx:#e8ebee;--mu:#9aa5b1;--bd:#333b44;--ac:#6b93f5;--acx:#0d1117;--ok:#4cc38a;--er:#f08a80;--hd:#262c33;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.up{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.up label{display:block;font-weight:600;margin-bottom:6px}
input[type=file]{width:100%;padding:8px;border:1px dashed var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#msg{margin-top:10px;min-height:20px;font-size:14px}.ok{color:var(--ok)}.er{color:var(--er)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.bar input,.bar select{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.bar .n{margin-left:auto;color:var(--mu);font-size:14px}
.wrap{overflow-x:auto;max-width:100%;border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{background:var(--hd);position:sticky;top:0}
td select{padding:4px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.empty{padding:24px;text-align:center;color:var(--mu)}
</style></head>
<body><main>
<h1>Sales to Onboarding</h1>
<p class="sub">Roz dono files upload karein. Data isi browser mein save rehta hai, purana data remove nahi hota.</p>
<div class="card">
 <div class="up">
  <div><label for="fa">1. Onboarding Agent file</label><input id="fa" type="file" accept=".xlsx,.xls,.csv"></div>
  <div><label for="fp">2. Payment Paid file</label><input id="fp" type="file" accept=".xlsx,.xls,.csv"></div>
 </div>
 <div style="margin-top:14px"><button id="go">Upload and Distribute</button></div>
 <div id="msg"></div>
</div>
<div class="card">
 <div class="bar">
  <input id="q" type="search" placeholder="Search...">
  <select id="dt"><option value="">All dates</option></select>
  <button id="ex">Export Excel</button><button id="bs">Save Backup</button><button id="bl">Load Backup</button><input id="bf" type="file" accept=".json" hidden><span class="n" id="cnt"></span>
 </div>
 <div class="wrap"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
let db=null,chunks={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function msg(t,e){const m=$('msg');m.textContent=t;m.className=e?'er':'ok'}
const pad=n=>String(n).padStart(2,'0');
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function iso(v){if(isNaN(v))return'';const d=v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());const t=pad(v.getHours())+':'+pad(v.getMinutes());return t==='00:00'?d:d+' '+t}
function nd(v){v=String(v||'').trim();let m=v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
 m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);if(m)return(m[3].length===2?'20'+m[3]:m[3])+'-'+pad(m[2])+'-'+pad(m[1]);
 m=v.match(/^(\d{1,2})[- ]([A-Za-z]{3})[a-z]*[- ,]+(\d{2,4})/);if(m&&MON[m[2].toLowerCase()])return(m[3].length===2?'20'+m[3]:m[3])+'-'+pad(MON[m[2].toLowerCase()])+'-'+pad(m[1]);return''}
async function readSheet(f){
 const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
 const ws=wb.Sheets[wb.SheetNames[0]];Object.keys(ws).forEach(k=>{const c=ws[k];if(k[0]!=='!'&&c&&c.t==='d'&&c.v instanceof Date)c.w=iso(c.v)});const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
 const h=aoa.findIndex(r=>r.some(c=>String(c).trim()!==''));
 if(h<0)return{heads:[],rows:[]};
 const seen={};
 const heads=aoa[h].map((x,i)=>{let k=String(x).trim()||'Column '+(i+1);if(seen[k]){seen[k]++;k+=' ('+seen[k]+')'}else seen[k]=1;return k});
 const rows=aoa.slice(h+1).filter(r=>r.some(c=>String(c).trim()!=='')).map(r=>{const o={};heads.forEach((k,i)=>o[k]=String(r[i]??'').trim());return o});
 return{heads,rows};
}
const find=(hs,...re)=>hs.find(h=>re.every(r=>r.test(h)));
async function go(){
 const fa=$('fa').files[0],fp=$('fp').files[0];
 if(!fa||!fp){msg('Dono files select karein.',1);return}
 $('go').disabled=true;msg('Processing...');
 try{
  const a=await readSheet(fa),p=await readSheet(fp);
  const eC=find(a.heads,/emp/i,/id/i)||find(a.heads,/emp/i),lC=find(a.heads,/agent/i,/name/i)||find(a.heads,/name/i);
  const dC=find(p.heads,/agent/i,/display/i)||find(p.heads,/display/i);
  const tC=find(p.heads,/activation/i,/date/i)||find(p.heads,/activation/i)||find(p.heads,/(paid|payment|pay)/i,/date/i)||find(p.heads,/date/i);
  if(!eC){msg('Onboarding file mein Emp ID column nahi mila.',1);return}
  if(!lC){msg('Onboarding file mein Agent Name column nahi mila.',1);return}
  if(!dC){msg('Payment file mein Agent Display Name column nahi mila.',1);return}
  const agents=[],seen=new Set();
  a.rows.forEach(r=>{const e=r[eC];if(e&&!seen.has(e)){seen.add(e);agents.push({e,l:r[lC]})}});
  if(!agents.length){msg('Onboarding file mein koi Emp ID nahi mili.',1);return}
  const isId=v=>v&&!/\s/.test(v)&&/\d/.test(v);
  let i=0,skipped=0;const out=[];
  const have=new Set();Object.values(chunks).forEach(c=>c.rows.forEach(x=>have.add(JSON.stringify([x.c,x.dt||'']))));let dup=0;
  p.rows.forEach(r=>{if(!isId(r[dC])){skipped++;return}const dt=tC?nd(r[tC]):'',k=JSON.stringify([r,dt]);if(have.has(k)){dup++;return}have.add(k);const g=agents[i++%agents.length];out.push({e:g.e,l:g.l,d:'Not Done',c:r,dt})});
  if(!out.length){msg(dup?dup+' rows pehle se saved hain, koi nayi row nahi mili.':'Koi bhi row distribute nahi hui (Agent Display Name mein ID nahi mili).',1);return}
  const list=[];let cur=[],size=0;
  out.forEach(o=>{const s=JSON.stringify(o).length;if(cur.length&&size+s>80000){list.push(cur);cur=[];size=0}cur.push(o);size+=s});
  if(cur.length)list.push(cur);
  const ts=Date.now(),date=new Date().toLocaleDateString('en-CA');
  for(let k=0;k<list.length;k++)
   {const id=ts+'-'+String(k).padStart(3,'0'),v={ts,k,date,heads:p.heads,rows:list[k]};await save(id,v);chunks[id]=v}
  msg(out.length+' rows distribute hui, '+skipped+' rows skip (ID nahi thi)'+(dup?', '+dup+' rows pehle se saved thi (dobara add nahi hui)':'')+'. Data save ho gaya.'+(!tC?' Payment file mein date column nahi mila, upload date use hui.':out.some(o=>!o.dt)?' Kuch rows ki date samajh nahi aayi, unme upload date use hui.':' Date column: '+tC));
  render();$('fa').value='';$('fp').value='';
 }catch(e){msg('Error: '+(e.message||e.code||e),1)}
 finally{$('go').disabled=false}
}
function render(){
 const ids=Object.keys(chunks).sort();let heads=[],rows=[],dates=new Set();
 ids.forEach(id=>{const c=chunks[id];(c.heads||[]).forEach(h=>{if(!heads.includes(h))heads.push(h)});c.rows.forEach((r,i)=>{dates.add(r.dt||c.date);rows.push({id,i,date:r.dt||c.date,r})})});
 const sel=$('dt'),cv=sel.value;
 sel.innerHTML='<option value="">All dates</option>'+[...dates].sort().reverse().map(d=>'<option'+(d===cv?' selected':'')+'>'+esc(d)+'</option>').join('');
 const q=$('q').value.trim().toLowerCase(),dv=sel.value;
 const f=rows.filter(x=>(!dv||x.date===dv)&&(!q||(x.r.e+' '+x.r.l+' '+Object.values(x.r.c).join(' ')).toLowerCase().includes(q)));
 $('cnt').textContent=f.length+' rows';
 $('th').innerHTML='<tr><th>Date</th><th>Emp. ID</th><th>Onboarding Agent</th><th>Onboarding Done or Not</th>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>';
 const shown=f.slice(0,3000);
 $('tb').innerHTML=shown.length?shown.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.r.e)+'</td><td>'+esc(x.r.l)+'</td><td><select data-c="'+x.id+'" data-i="'+x.i+'"><option'+(x.r.d==='Done'?' selected':'')+'>Done</option><option'+(x.r.d!=='Done'?' selected':'')+'>Not Done</option></select></td>'+heads.map(h=>'<td>'+esc(x.r.c[h])+'</td>').join('')+'</tr>').join(''):'<tr><td class="empty" colspan="'+(heads.length+4)+'">Abhi koi data nahi hai. Upar files upload karein.</td></tr>';
}
$('tb').addEventListener('change',async e=>{
 const s=e.target.closest('select[data-c]');if(!s)return;
 const c=chunks[s.dataset.c];c.rows[+s.dataset.i].d=s.value;
 try{await save(s.dataset.c,c)}catch(x){msg('Status save nahi hua.',1)}
});
$('q').addEventListener('input',render);$('dt').addEventListener('change',render);$('go').addEventListener('click',go);
render();
let DB;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('s2o',1);r.onupgradeneeded=()=>r.result.createObjectStore('chunks');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function save(id,v){const d=DB||(DB=await idb());return new Promise((res,rej)=>{const t=d.transaction('chunks','readwrite');t.objectStore('chunks').put(v,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function loadAll(){const d=DB||(DB=await idb());return new Promise((res,rej)=>{const t=d.transaction('chunks');const o=t.objectStore('chunks'),k=o.getAllKeys(),v=o.getAll();t.oncomplete=()=>{const r={};k.result.forEach((x,i)=>r[x]=v.result[i]);res(r)};t.onerror=()=>rej(t.error)})}
$('ex').onclick=()=>{const rows=[];Object.keys(chunks).sort().forEach(id=>{const c=chunks[id];c.rows.forEach(r=>rows.push({'Date':r.dt||c.date,'Emp. ID':r.e,'Onboarding Agent':r.l,'Onboarding Done or Not':r.d,...r.c}))});if(!rows.length){msg('Export ke liye data nahi hai.',1);return}const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Data');XLSX.writeFile(wb,'sales-to-onboarding.xlsx')};
$('bs').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(chunks)],{type:'application/json'}));a.download='sales-to-onboarding-backup.json';a.click()};
$('bl').onclick=()=>$('bf').click();
$('bf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());for(const k of Object.keys(o)){await save(k,o[k]);chunks[k]=o[k]}render();msg('Backup load ho gaya (purana data safe hai).')}catch(x){msg('Backup file sahi nahi hai.',1)}e.target.value=''};
loadAll().then(o=>{chunks=o;render()}).catch(e=>msg('Browser storage available nahi hai: '+e,1));
</script></body></html>
